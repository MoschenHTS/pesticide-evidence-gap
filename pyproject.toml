[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pesticide-evidence"
version = "0.1.0"
description = "Analysis of toxicity research on pesticide active ingredients by Northern register status, funders and use."
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyarrow", "requests", "pyyaml", "openpyxl", "xlrd", "matplotlib", "tabulate"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 160
